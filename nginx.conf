server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify Traefik (TLS terminated outside). Don't include scheme/host/
    # port in redirects — otherwise /app → /app/ leaks the internal :3000.
    absolute_redirect off;
    port_in_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_min_length 256;

    # Cache static assets
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Browser API — проксируем на backend бота (same-origin, без CORS-танцев).
    # Бот слушает :3000 в своём контейнере, снаружи — sslip-домен через Traefik.
    location /api/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $bot_backend "wap24yzv4wg4w0t9v8g9mxze.89.127.192.216.sslip.io";
        proxy_pass http://$bot_backend;
        proxy_set_header Host $bot_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;      # скачивание длинного видео
        proxy_send_timeout 300s;
        proxy_buffering off;          # файлы стримим, не буферим на диск
        client_max_body_size 1m;
    }

    # Astro generates pretty URLs (e.g. /instagram/index.html) — try those first
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }

    # Don't log favicon misses
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
